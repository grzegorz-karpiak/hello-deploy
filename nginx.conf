# The master runs as the unprivileged nginx user from the image, so this
# directive is ignored at runtime (nginx logs a warning). It is kept so that
# worker processes never run as root if the image is started as root anyway.
user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide nginx version
    server_tokens off;

    # Logging to stdout/stderr for container-native logging
    access_log /dev/stdout combined;
    error_log /dev/stderr warn;

    # Temp paths live directly in /tmp (tmpfs at runtime). nginx creates these
    # leaf directories itself at startup, so no pre-created parent is needed.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Security headers are repeated in every location: once a location defines
    # its own add_header, the server-level headers are no longer inherited.
    server {
        listen 8080;
        listen [::]:8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Health check endpoint
        location = /health {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
            return 200 "ok\n";
        }

        # Build info JSON
        location = /build-info.json {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
            try_files $uri =404;
        }

        # Main HTML
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
            try_files $uri =404;
        }

        # Static assets
        location ~* \.(css|js|ico|svg|png|jpg|jpeg|gif|webp|woff|woff2)$ {
            add_header Cache-Control "public, max-age=300, must-revalidate" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
            try_files $uri =404;
        }

        # All other requests
        location / {
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
            try_files $uri $uri/ =404;
        }
    }
}
